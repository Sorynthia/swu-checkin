name: 自动签到

# ========================================
# 开关配置
# ========================================
# 如需启用自动签到，将 ENABLED 改为 true
# 如需禁用自动签到，将 ENABLED 改为 false
env:
  ENABLED: false  # 默认关闭，需要手动改为 true

on:
  schedule:
    # 每天北京时间 21:30 (UTC 13:30)
    - cron: '30 13 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    strategy:
      # 多账号并行执行，失败不影响其他账号
      fail-fast: false
      matrix:
        account:
          - name: "账号1"
            username_secret: SWU_USERNAME
            password_secret: SWU_PASSWORD
          # 如需添加更多账号，取消下面的注释并配置对应的 Secrets
          # - name: "账号2"
          #   username_secret: SWU_USERNAME_2
          #   password_secret: SWU_PASSWORD_2
          # - name: "账号3"
          #   username_secret: SWU_USERNAME_3
          #   password_secret: SWU_PASSWORD_3
    
    name: 签到 - ${{ matrix.account.name }}
    
    steps:
      - name: 检查是否启用
        id: check_enabled
        run: |
          if [ "${{ env.ENABLED }}" != "true" ]; then
            echo "========================================="
            echo "⚠️  自动签到未启用"
            echo "========================================="
            echo ""
            echo "如需启用自动签到，请编辑 .github/workflows/checkin.yml"
            echo "将 ENABLED 改为 true"
            echo ""
            echo "步骤："
            echo "1. 进入仓库主页"
            echo "2. 打开 .github/workflows/checkin.yml"
            echo "3. 点击编辑按钮"
            echo "4. 将 'ENABLED: false' 改为 'ENABLED: true'"
            echo "5. 提交更改"
            echo ""
            echo "========================================="
            exit 1
          fi
          echo "✅ 自动签到已启用"
      
      - name: 检出代码
        if: env.ENABLED == 'true'
        uses: actions/checkout@v4
      
      - name: 设置 Python
        if: env.ENABLED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        if: env.ENABLED == 'true'
        run: |
          echo "========================================="
          echo "开始安装依赖..."
          echo "========================================="
          pip install --upgrade pip
          pip install -e .
          echo ""
          echo "✅ 依赖安装完成"
          echo ""
      
      - name: 执行签到
        if: env.ENABLED == 'true'
        id: checkin
        env:
          SWUDK_USERNAME: ${{ secrets[matrix.account.username_secret] }}
          SWUDK_PASSWORD: ${{ secrets[matrix.account.password_secret] }}
        run: |
          echo "========================================="
          echo "开始执行签到任务"
          echo "账号名称: ${{ matrix.account.name }}"
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          if [ -n "$SWUDK_USERNAME" ]; then
            echo "账号: ${SWUDK_USERNAME:0:4}****${SWUDK_USERNAME: -2}"
          else
            echo "⚠️  账号未配置（Secret: ${{ matrix.account.username_secret }}）"
          fi
          echo "========================================="
          echo ""
          
          if [ -z "$SWUDK_USERNAME" ] || [ -z "$SWUDK_PASSWORD" ]; then
            echo "❌ 账号或密码未配置，跳过签到"
            echo "请在 GitHub Secrets 中配置："
            echo "  - ${{ matrix.account.username_secret }}"
            echo "  - ${{ matrix.account.password_secret }}"
            exit 1
          fi
          
          python -m swu_checkin.check_in > checkin_result.txt 2>&1
          exit_code=$?
          
          echo ""
          echo "========================================="
          echo "签到结果"
          echo "========================================="
          cat checkin_result.txt
          echo ""
          
          # 提取返回码和消息
          result_line=$(cat checkin_result.txt | tail -1)
          status_code=$(echo "$result_line" | grep -oP '\[\K[0-9]+(?=\])')
          status_msg=$(echo "$result_line" | grep -oP '\] \K.*')
          
          echo "status_code=$status_code" >> $GITHUB_OUTPUT
          echo "status_msg=$status_msg" >> $GITHUB_OUTPUT
          echo "full_result=$result_line" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          
          echo "========================================="
          echo "状态码: $status_code"
          echo "状态信息: $status_msg"
          echo "退出码: $exit_code"
          echo "========================================="
          
          # 1=成功, 2=已签到，其他都算失败
          if [ "$status_code" != "1" ] && [ "$status_code" != "2" ]; then
            echo ""
            echo "⚠️  签到异常，准备发送通知邮件"
            exit 1
          fi
          
          echo ""
          echo "✅ 签到正常完成"
        continue-on-error: true
      
      - name: 发送通知邮件
        if: env.ENABLED == 'true' && steps.checkin.outputs.status_code != '1' && steps.checkin.outputs.status_code != '2'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '⚠️ SWU 签到异常 - ${{ matrix.account.name }} - ${{ steps.checkin.outputs.status_msg }}'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ## 签到任务执行异常
            
            **账号名称**: ${{ matrix.account.name }}
            **执行时间**: ${{ github.event.repository.updated_at }}
            **仓库**: ${{ github.repository }}
            **运行ID**: ${{ github.run_id }}
            
            ---
            
            ### 签到结果
            
            **状态码**: ${{ steps.checkin.outputs.status_code }}
            **状态信息**: ${{ steps.checkin.outputs.status_msg }}
            
            ### 状态码说明
            
            - [0] 今日无签到记录
            - [1] ✅ 签到成功
            - [2] ✅ 已签到
            - [3] ❌ 登录失败
            - [4] ❌ 网络错误或数据异常
            - [5] ℹ️ 请假期间无需签到
            
            ---
            
            ### 完整输出
            
            `
            ${{ steps.checkin.outputs.full_result }}
            `
            
            ---
            
            ### 操作建议
            
            **状态码 0**: 今日暂无签到任务，无需处理
            **状态码 3**: 请检查 GitHub Secrets 中的账号密码是否正确
            **状态码 4**: 网络异常或学校系统维护，稍后会自动重试
            **状态码 5**: 请假期间自动跳过，无需处理
            
            ---
            
            查看详细日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
      - name: 最终状态检查
        if: always() && env.ENABLED == 'true'
        run: |
          echo ""
          echo "========================================="
          echo "任务执行完成 - ${{ matrix.account.name }}"
          echo "========================================="
          echo "状态码: ${{ steps.checkin.outputs.status_code }}"
          echo "状态信息: ${{ steps.checkin.outputs.status_msg }}"
          
          if [ "${{ steps.checkin.outputs.status_code }}" = "1" ]; then
            echo "✅ 签到成功"
          elif [ "${{ steps.checkin.outputs.status_code }}" = "2" ]; then
            echo "✅ 已签到，无需重复"
          else
            echo "⚠️  签到异常，已发送通知邮件"
          fi
          echo "========================================="